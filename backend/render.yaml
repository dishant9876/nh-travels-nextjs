services:
  - type: web
    name: nh-travels-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements-production.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn nh_backend.wsgi:application --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"

      - key: DATABASE_URL
        fromDatabase:
          name: nh-travels-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        sync: false          # set the real value in the Render dashboard

      - key: DJANGO_DEBUG
        value: "0"            # your settings.py checks for "1", so "0" = False

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"   # add your custom domain here too, comma-separated, once you have one

      - key: CORS_ALLOWED_ORIGINS
        value: "https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app"   # comma-separated if multiple, no spaces

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: nh-travels-db
    plan: free